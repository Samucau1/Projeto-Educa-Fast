# Ambiente descartável: não utiliza .env, portas ou volumes do MySQL instalado.
services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: educafast_regressao
      POSTGRES_USER: testes
      POSTGRES_PASSWORD: senha-exclusiva-de-testes
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testes -d educafast_regressao"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  testes:
    build:
      context: ..
      dockerfile: api/tests/Dockerfile
    environment:
      EDUCAFAST_TEST_DB: "1"
      DB_URL: postgresql+psycopg://testes:senha-exclusiva-de-testes@postgres_test:5432/educafast_regressao
      SECRET_KEY: chave-exclusiva-do-container-de-testes
      DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    volumes:
      - ../docs/testes/resultados:/workspace/docs/testes/resultados
    depends_on:
      postgres_test:
        condition: service_healthy
  manual:
    profiles: ["manual"]
    build:
      context: ..
      dockerfile: api/tests/Dockerfile
    command: ["python", "tests/servidor_manual.py"]
    environment:
      EDUCAFAST_MANUAL: "1"
      EDUCAFAST_TEST_DB: "1"
      DB_URL: postgresql+psycopg://testes:senha-exclusiva-de-testes@postgres_test:5432/educafast_regressao
      SECRET_KEY: chave-exclusiva-do-ambiente-manual
      DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      UPLOAD_FOLDER: /tmp/educafast-uploads
    ports:
      - "127.0.0.1:5050:5000"
    depends_on:
      postgres_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
