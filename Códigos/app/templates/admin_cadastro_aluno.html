<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos | Secretaria Escolar DF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="flex">
    <div id="admin-cadastro-aluno-root" class="flex w-full" data-react-shell data-react-template="admin-cadastro-aluno-template"></div>
    <template id="admin-cadastro-aluno-template">
    <aside class="w-72 glass-sidebar h-screen sticky top-0 flex flex-col p-6">
        <div class="mb-10 text-center">
            <h2 class="text-xl font-bold tracking-tighter text-cyan-400">SECRETARIA DF</h2>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Gestão Acadêmica</p>
        </div>

        <nav class="flex-1 space-y-2">
            <div class="text-[10px] font-bold text-gray-500 mb-2 ml-4">PRINCIPAL</div>
            <a href="{{ url_for('home.admin_dashboard') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Painel Geral
            </a>

            <div class="text-[10px] font-bold text-gray-500 mt-6 mb-2 ml-4">ADMINISTRAÇÃO</div>
            <a href="{{ url_for('home.admin_cadastro_alunos') }}" class="flex items-center px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                Alunos
            </a>
            <a href="{{ url_for('home.admin_cadastro_professores') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Professores
            </a>
            <a href="{{ url_for('home.admin_banco_dados') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Banco de Dados
            </a>

            <div class="text-[10px] font-bold text-gray-500 mt-6 mb-2 ml-4">PEDAGÓGICO</div>
            <a href="{{ url_for('home.admin_disciplinas') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Disciplinas
            </a>
            <a href="{{ url_for('home.admin_turmas') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Turmas
            </a>
            <a href="{{ url_for('home.admin_comunicados') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Comunicados
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/10">
            <a href="{{ url_for('auth.logout') }}" class="flex items-center px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 transition-all">
                Sair do Sistema
            </a>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-10 flex flex-col gap-5 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-bold">Cadastro de Alunos</h1>
                <p class="text-gray-400">Insira as informações do novo aluno no sistema.</p>
            </div>

            <div class="flex flex-wrap gap-4">
                <button type="reset" form="aluno-form" class="inline-flex h-12 items-center rounded-xl border border-white/10 bg-white/5 px-6 font-bold text-white transition hover:bg-white/10">
                    Limpar
                </button>
                <button type="submit" form="aluno-form" class="inline-flex h-12 items-center rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 px-7 font-bold text-white transition hover:brightness-110">
                    Salvar Registro
                </button>
            </div>
        </header>

            <div class="grid gap-8 xl:grid-cols-[minmax(0,1fr)_368px]">
                <form id="aluno-form" class="glass-card cadastro-card rounded-[32px] px-6 py-8 md:px-10 lg:px-10" enctype="multipart/form-data">
                    <section>
                        <h2 class="text-xl font-extrabold text-white">Informações Pessoais</h2>
                        <div class="mt-5 border-t border-white/10 pt-7">
                            <div class="grid gap-8 md:grid-cols-2">
                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Nome Completo</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="text" name="nome" placeholder="Ex: João da Silva" required>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Número de Matrícula</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="text" name="matricula" placeholder="Ex: 20240001" required>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Curso / Série</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <select name="curso">
                                            <option value="">Selecione um curso</option>
                                            <option>Ensino Fundamental</option>
                                            <option>Ensino Médio</option>
                                            <option>Educação de Jovens e Adultos</option>
                                        </select>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Status da Matrícula</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <select name="status">
                                            <option>Ativo</option>
                                            <option>Pendente</option>
                                            <option>Inativo</option>
                                        </select>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">E-mail de Acesso</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="email" name="email" placeholder="aluno@email.com" required>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Senha Inicial</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="password" name="senha" placeholder="Defina uma senha" required>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </section>

                    <section class="mt-9">
                        <h2 class="text-xl font-extrabold text-white">Documentação</h2>
                        <div class="mt-5 border-t border-white/10 pt-7">
                            <div class="grid gap-8 md:grid-cols-2">
                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">CPF</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-5">
                                        <input type="text" name="cpf" placeholder="000.000.000-00">
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Data de Nascimento</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-5">
                                        <input type="date" name="data_nascimento">
                                    </span>
                                </label>
                            </div>
                        </div>
                    </section>
                    <p id="aluno-feedback" class="mt-8 hidden rounded-2xl border px-4 py-3 text-sm font-semibold"></p>
                </form>

                <aside class="space-y-8">
                    <section class="glass-card cadastro-card rounded-[32px] px-8 py-9">
                        <h2 class="text-lg font-extrabold text-white">Foto do Aluno</h2>
                        <label class="mx-auto mt-7 flex aspect-square w-40 cursor-pointer flex-col items-center justify-center rounded-[22px] border-2 border-dashed border-cyan-400/35 bg-white/5 text-center transition hover:border-cyan-300 hover:bg-white/10">
                            <input type="file" name="foto_perfil" form="aluno-form" class="sr-only" accept="image/png,image/jpeg">
                            <span class="mt-3 text-xs text-slate-400">Carregar Imagem</span>
                        </label>
                        <p class="mt-7 text-center text-[11px] leading-5 text-slate-400">Formatos aceitos: JPG, PNG.<br>Tamanho máximo: 2MB.</p>
                    </section>

                    <section class="rounded-[20px] border border-cyan-500/20 bg-cyan-500/10 px-8 py-8 shadow-2xl shadow-black/20">
                        <h2 class="text-lg font-extrabold text-white">Dica de Gestão</h2>
                        <p class="mt-5 text-sm leading-6 text-slate-300">Certifique-se de que todos os documentos originais foram digitalizados antes de finalizar o cadastro. O sistema enviará um e-mail automático de confirmação para o responsável.</p>
                    </section>
                </aside>
            </div>
    </main>
</template>
    <script>
        window.__REACT_PAGE__ = {
            routes: {
                cadastroAluno: {{ url_for('auth.cadastro_aluno')|tojson }}
            }
        };
    </script>
    <script src="{{ url_for('static', filename='js/paginas/cadastro.js') }}"></script>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
