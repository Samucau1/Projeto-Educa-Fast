# Standalone deployment: do not combine with the development/manual files.
services:
  app:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "443:5000"
    environment:
      APP_ENV: production
      COOKIE_SECURE: "1"
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Configure DATA_ENCRYPTION_KEY}
      LGPD_CONTROLADOR: ${LGPD_CONTROLADOR:-EducaFast}
      LGPD_CONTATO: ${LGPD_CONTATO:?Configure LGPD_CONTATO}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Configure o dominio publico}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-app_web}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      DB_SSL_CA: /run/tls/ca.crt
      TLS_CERT_FILE: /run/tls/web.crt
      TLS_KEY_FILE: /run/tls/web.key
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - ./certs/ca.crt:/run/tls/ca.crt:ro
      - ./certs/web.crt:/run/tls/web.crt:ro
      - ./certs/web.key:/run/tls/web.key:ro
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # TLS obrigatorio: hostssl no pg_hba recusa conexoes sem criptografia vindas da rede.
    command: ["-c", "ssl=on", "-c", "ssl_ca_file=/run/tls/ca.crt", "-c", "ssl_cert_file=/run/tls/db.crt",
              "-c", "ssl_key_file=/run/tls/db.key", "-c", "hba_file=/run/tls/pg_hba.conf"]
    environment:
      POSTGRES_DB: ${DB_NAME:-app_web}
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/pg_hba.conf:/run/tls/pg_hba.conf:ro
      - ./certs/ca.crt:/run/tls/ca.crt:ro
      - ./certs/db.crt:/run/tls/db.crt:ro
      - ./certs/db.key:/run/tls/db.key:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
networks:
  frontend: {}
  backend:
    internal: true
volumes:
  postgres_data:
  uploads_data:
