{% set page_title = 'Área do aluno' %}
{% from 'partials/gestao_icons.html' import icon %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno | Educa Fast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/aluno_painel.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="app-page">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="aluno-painel-root" class="flex w-full" data-react-shell data-react-template="aluno-painel-template"></div>
    <template id="aluno-painel-template">
    {% include 'partials/workspace_sidebar.html' %}

    <div class="workspace-main">
    {% include 'partials/workspace_topbar.html' %}
    <main id="main-content" class="app-content">
        <header class="flex justify-between items-center mb-10">
            <div>
                <span class="eyebrow">MINHA ESCOLA</span>
                    <h1 class="text-3xl font-bold">Olá, {{ aluno.nome }}!</h1>
                <p class="text-gray-400">Matrícula {{ aluno.matricula }} · {{ aluno.curso }}</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-sm font-bold">{{ aluno.email }}</p>
                    <p class="text-[10px] text-cyan-400">{{ aluno.status }}</p>
                </div>
                {% if aluno.foto_perfil %}
                <img src="{{ url_for('document.perfil_arquivo', filename=aluno.foto_perfil) }}" alt="Foto de {{ aluno.nome }}" class="w-12 h-12 rounded-full border-2 border-white/20 object-cover">
                {% else %}
                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 border-2 border-white/20"></div>
                {% endif %}
            </div>
        </header>

        <section id="disciplinas" data-aluno-panel="disciplinas" class="mb-10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Disciplinas</h2>
                <span class="text-sm text-gray-400">Vínculos cadastrados</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                {% for disciplina in disciplinas %}
                <article class="glass-card aluno-card aluno-discipline-card rounded-3xl p-5">
                    <a href="{{ url_for('aluno.disciplina_detail', disciplina_id=disciplina.id) }}" class="aluno-discipline-toggle">
                        <span>
                            <strong>{{ disciplina.nome }}</strong>
                            <small>Código: {{ disciplina.codigo }} · {{ disciplina.carga_horaria }}h</small>
                        </span>
                    </a>
                    <p class="mt-3 text-xs uppercase tracking-wider text-gray-500">Professor</p>
                    <p class="mt-1 text-sm text-gray-300">
                        {% if disciplina.professores %}
                            {{ disciplina.professores|join(", ") }}
                        {% else %}
                            Nenhum professor associado.
                        {% endif %}
                    </p>
                </article>
                {% else %}
                <div class="glass-card aluno-card rounded-3xl p-5 md:col-span-2 xl:col-span-3">
                    <h3 class="font-bold text-cyan-400">Nenhuma disciplina associada</h3>
                    <p class="mt-3 text-sm leading-6 text-gray-300">As disciplinas aparecerão quando a administração vincular seu cadastro.</p>
                </div>
                {% endfor %}
            </div>
        </section>

        <section id="notas" data-aluno-panel="notas" class="glass-card aluno-card rounded-[32px] p-8 mb-10 aluno-panel-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Notas</h2>
                <a class="button button-primary" href="{{ url_for('academico.meu_boletim') }}">Abrir boletim por turma e período</a>
                <span class="text-sm text-gray-400">Lançamentos disponíveis</span>
            </div>

            <div class="aluno-table-wrapper">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-500 text-xs uppercase tracking-wider">
                            <th class="pb-4 font-medium">Disciplina</th>
                            <th class="pb-4 font-medium">Nota</th>
                            <th class="pb-4 font-medium">Observação</th>
                            <th class="pb-4 font-medium">Data</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm">
                        {% for nota in notas %}
                        <tr class="border-t border-white/5">
                            <td class="py-4 font-medium text-white">{{ nota.disciplina }}</td>
                            <td class="py-4 text-cyan-400 font-bold">{{ nota.nota }}</td>
                            <td class="py-4 text-gray-400">{{ nota.observacao }}</td>
                            <td class="py-4 text-gray-400">{{ nota.data }}</td>
                        </tr>
                        {% else %}
                        <tr class="border-t border-white/5">
                            <td class="py-6 text-gray-400" colspan="4">Nenhuma nota lançada até o momento.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>

        <section id="documentos" data-aluno-panel="documentos" class="grid gap-8 xl:grid-cols-[minmax(0,1fr)_380px] aluno-panel-hidden">
            <div class="glass-card aluno-card rounded-[32px] p-8">
                <h2 class="text-xl font-bold">Documentos Solicitados</h2>
                <p class="mt-1 text-sm text-gray-400">Envie apenas os arquivos pedidos pela secretaria.</p>

                <div class="mt-6 space-y-4">
                    {% for solicitacao in solicitacoes_documentos %}
                    <article class="aluno-request-item">
                        <div>
                            <h3>{{ solicitacao.titulo }}</h3>
                            <p>{{ solicitacao.mensagem }}</p>
                            <span>{{ solicitacao.data }}</span>
                        </div>
                        <strong class="aluno-request-status aluno-request-status-{{ solicitacao.status }}">{{ solicitacao.status_label }}</strong>
                        {% if solicitacao.status != "enviado" %}
                        <form action="{{ url_for('aluno.upload_documento_aluno') }}" method="post" enctype="multipart/form-data" class="aluno-request-upload"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                            <input type="hidden" name="solicitacao_id" value="{{ solicitacao.id }}">
                            <input name="arquivo" type="file" required class="aluno-file">
                            <button class="aluno-submit compact">Enviar</button>
                        </form>
                        {% endif %}
                    </article>
                    {% else %}
                    <div class="aluno-doc-item">
                        <div>
                            <h3>Nenhum documento solicitado</h3>
                            <p>Quando a secretaria pedir um documento, ele aparecerá aqui.</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="glass-card aluno-card rounded-[32px] p-8">
                <h2 class="text-xl font-bold">Arquivos Enviados</h2>
                <p class="mt-1 text-sm text-gray-400">Histórico dos documentos encaminhados.</p>

                <div class="mt-6 space-y-4">
                    {% for documento in documentos %}
                    <article class="aluno-doc-item">
                        <div>
                            <h3>{{ documento.titulo }}</h3>
                            <p>{{ documento.data }}</p>
                        </div>
                        <a href="{{ url_for('document.download_arquivo', filename=documento.arquivo) }}">Baixar</a>
                    </article>
                    {% else %}
                    <div class="aluno-doc-item">
                        <div>
                            <h3>Nenhum documento enviado</h3>
                            <p>Os arquivos enviados aparecerão aqui.</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>
    </div>
</template>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
