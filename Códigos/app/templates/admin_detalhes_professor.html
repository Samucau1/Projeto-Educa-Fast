{% set page_title = 'Detalhes do professor' %}
{% from 'partials/gestao_icons.html' import icon %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Professor | Educa Fast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detalhes.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="app-page">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="admin-detalhes-professor-root" class="flex w-full" data-react-shell data-react-template="admin-detalhes-professor-template"></div>
    <template id="admin-detalhes-professor-template">

    {% include 'partials/workspace_sidebar.html' %}

    <div class="workspace-main">
    {% include 'partials/workspace_topbar.html' %}
    <main id="main-content" class="app-content">
        <header class="flex justify-between items-center mb-10">
            <div>
                <span class="eyebrow">GESTÃO ESCOLAR</span>
                    <h1 class="text-3xl font-bold">Detalhes do Professor</h1>
                <p class="text-gray-400">Acompanhe cadastro, disciplinas, documentos e lançamentos.</p>
            </div>

        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <section class="glass-card detalhes-card p-8 rounded-[32px] text-center">
                {% if professor.foto_perfil %}
                <img src="{{ url_for('document.perfil_arquivo', filename=professor.foto_perfil) }}" alt="Foto de {{ professor.nome }}" class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-white/10 object-cover">
                {% else %}
                <div class="w-32 h-32 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full mx-auto mb-4 border-4 border-white/10"></div>
                {% endif %}
                <h2 class="text-2xl font-bold">{{ professor.nome }}</h2>
                <p class="text-cyan-400">Professor: PROF-{{ professor.id }}</p>
                <p class="text-gray-400 text-sm mt-2">{{ professor.disciplina }}</p>
                <p class="text-gray-400 text-sm mt-1">{{ professor.regime }}</p>
                <p class="text-gray-500 text-xs mt-1">{{ professor.email }}</p>

                <form action="{{ url_for('home.admin_editar_professor', professor_id=professor.id) }}" method="post" enctype="multipart/form-data" class="aluno-edit-form">
                    <h3>Editar Dados</h3>
                    <label>
                        <span>Foto de Perfil</span>
                        <input name="foto_perfil" type="file" accept="image/png,image/jpeg">
                    </label>
                    <label>
                        <span>Nome</span>
                        <input name="nome" type="text" value="{{ professor.nome }}" required>
                    </label>
                    <label>
                        <span>E-mail</span>
                        <input name="email" type="email" value="{{ professor.email }}" required>
                    </label>
                    <div class="aluno-edit-grid">
                        <label>
                            <span>CPF</span>
                            <input name="cpf" type="text" value="{{ professor.cpf_value }}" required>
                        </label>
                        <label>
                            <span>Telefone</span>
                            <input name="telefone" type="text" value="{{ professor.telefone_value }}">
                        </label>
                    </div>
                    <label>
                        <span>Disciplina Principal</span>
                        <input name="disciplina_principal" type="text" value="{{ professor.disciplina_value }}">
                    </label>
                    <label>
                        <span>Formação Acadêmica</span>
                        <input name="formacao_academica" type="text" value="{{ professor.formacao_value }}">
                    </label>
                    <div class="aluno-edit-grid">
                        <label>
                            <span>Regime</span>
                            <select name="regime_trabalho">
                                <option value="">Não informado</option>
                                <option value="20 horas semanais" {% if professor.regime_value == "20 horas semanais" %}selected{% endif %}>20 horas semanais</option>
                                <option value="30 horas semanais" {% if professor.regime_value == "30 horas semanais" %}selected{% endif %}>30 horas semanais</option>
                                <option value="40 horas semanais" {% if professor.regime_value == "40 horas semanais" %}selected{% endif %}>40 horas semanais</option>
                                <option value="Dedicação exclusiva" {% if professor.regime_value == "Dedicação exclusiva" %}selected{% endif %}>Dedicação exclusiva</option>
                            </select>
                        </label>
                        <label>
                            <span>Admissão</span>
                            <input name="data_admissao" type="date" value="{{ professor.data_admissao_value }}">
                        </label>
                    </div>
                    <button>Salvar Alterações</button>
                </form>
            </section>

            <div class="lg:col-span-2 space-y-8">
            <div class="glass-card detalhes-card p-6 rounded-[24px]">
                <div class="flex gap-4 border-b border-white/10" data-professor-section-tabs>
                    <button type="button" class="professor-section-tab pb-2 border-b-2 border-cyan-400 text-white" data-professor-section-tab="atuacao">Atuação</button>
                    <button type="button" class="professor-section-tab pb-2 text-gray-500" data-professor-section-tab="documentos">Documentos</button>
                </div>
            </div>

            <section class="glass-card detalhes-card p-8 rounded-[32px]" data-professor-section-panel="atuacao">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Atuação do Professor</h3>
                    <span class="text-sm text-cyan-400">{{ professor.created_at_label }}</span>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div>
                        <h4 class="mb-4 text-sm font-bold uppercase tracking-wider text-gray-400">Disciplinas associadas</h4>
                        {% for disciplina in disciplinas %}
                        <div class="documento-request-item">
                            <div>
                                <span class="block text-white">{{ disciplina.nome }}</span>
                                <span class="text-xs text-gray-500">{{ disciplina.codigo }} • {{ disciplina.carga_horaria }}h</span>
                            </div>
                            <span class="text-xs text-gray-500">{{ disciplina.data }}</span>
                        </div>
                        {% else %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5 text-gray-400">
                            Nenhuma disciplina associada a este professor.
                        </div>
                        {% endfor %}
                    </div>

                    <div>
                        <h4 class="mb-4 text-sm font-bold uppercase tracking-wider text-gray-400">Últimas notas lançadas</h4>
                        {% for nota in notas %}
                        <div class="documento-request-item">
                            <div>
                                <span class="block text-white">{{ nota.aluno }}</span>
                                <span class="text-xs text-gray-500">{{ nota.disciplina }} • {{ nota.observacao }}</span>
                            </div>
                            <span class="documento-status documento-status-enviado">{{ nota.nota }}</span>
                        </div>
                        {% else %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5 text-gray-400">
                            Nenhuma nota lançada por este professor.
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="mt-8">
                    <h4 class="mb-4 text-sm font-bold uppercase tracking-wider text-gray-400">Documentos enviados pelo professor</h4>
                    {% for documento in documentos %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 flex justify-between border border-white/5">
                            <div>
                                <span class="block text-white">{{ documento.titulo }}</span>
                                <span class="text-xs text-gray-500">{{ documento.aluno }} • {{ documento.disciplina }} • {{ documento.data_envio }}</span>
                            </div>
                            <a href="{{ url_for('document.download_arquivo', filename=documento.arquivo) }}" class="text-cyan-400">Baixar</a>
                        </div>
                    {% else %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5 text-gray-400">
                            Nenhum documento enviado por este professor.
                        </div>
                    {% endfor %}
                </div>
            </section>

            <section class="hidden glass-card detalhes-card p-8 rounded-[32px]" data-professor-section-panel="documentos">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Documentos do Professor</h3>
                    <span class="text-sm text-cyan-400">Solicitações e arquivos</span>
                </div>

                <div class="flex gap-4 border-b border-white/10 mb-6" data-documento-tabs>
                    <button type="button" class="documento-tab pb-2 border-b-2 border-cyan-400 text-white" data-documento-tab="solicitacoes">Solicitações</button>
                    <button type="button" class="documento-tab pb-2 text-gray-500" data-documento-tab="enviados">Enviados</button>
                </div>

                <div data-documento-panel="solicitacoes">
                    <form action="{{ url_for('home.admin_solicitar_documento_professor', professor_id=professor.id) }}" method="post" class="documento-request-form">
                        <label>
                            <span>Documento solicitado</span>
                            <input name="titulo" type="text" placeholder="Ex: Certificado atualizado" required>
                        </label>
                        <label>
                            <span>Orientação para o professor</span>
                            <textarea name="mensagem" placeholder="Informe prazo, formato ou observações importantes."></textarea>
                        </label>
                        <button>Disparar solicitação</button>
                    </form>

                    <form action="{{ url_for('document.upload_arquivo_professor', professor_id=professor.id) }}" method="post" enctype="multipart/form-data" class="documento-request-form mt-8">
                        <input type="hidden" name="redirect_to" value="{{ url_for('home.admin_detalhes_professor', professor_id=professor.id) }}">
                        <label>
                            <span>Documentos do professor</span>
                            <input name="titulo" type="text" placeholder="Ex: Contrato, certificado ou aviso" required>
                        </label>
                        <label>
                            <span>Arquivo</span>
                            <input name="arquivo" type="file" required>
                        </label>
                        <button>Enviar Arquivo</button>
                    </form>

                    <div class="mt-8">
                        <h4 class="mb-4 text-sm font-bold uppercase tracking-wider text-gray-400">Solicitações enviadas</h4>
                        {% for solicitacao in solicitacoes_documentos %}
                        <div class="documento-request-item">
                            <div>
                                <span class="block text-white">{{ solicitacao.titulo }}</span>
                                <span class="text-xs text-gray-500">{{ solicitacao.mensagem }}</span>
                            </div>
                            <div class="text-right">
                                <span class="documento-status documento-status-{{ solicitacao.status }}">{{ solicitacao.status_label }}</span>
                                <span class="block text-xs text-gray-500 mt-2">{{ solicitacao.data }}</span>
                            </div>
                        </div>
                        {% else %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5 text-gray-400">
                            Nenhuma solicitação enviada para este professor.
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="hidden" data-documento-panel="enviados">
                    <h4 class="mb-4 text-sm font-bold uppercase tracking-wider text-gray-400">Documentos do professor</h4>
                    {% for arquivo in arquivos_professor %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 flex justify-between border border-white/5">
                            <div>
                                <span class="block text-white">{{ arquivo.titulo }}</span>
                                <span class="text-xs text-gray-500">{{ arquivo.data_envio }}</span>
                            </div>
                            <a href="{{ url_for('document.download_arquivo', filename=arquivo.arquivo) }}" class="text-cyan-400">Baixar</a>
                        </div>
                    {% else %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5 text-gray-400">
                            Nenhum arquivo enviado para este professor.
                        </div>
                    {% endfor %}
                </div>
            </section>
            </div>
        </div>
    </main>
    </div>
</template>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
