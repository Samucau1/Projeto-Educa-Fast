<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas | Secretaria Escolar DF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_turmas.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="flex">
    <div id="admin-turmas-root" class="flex w-full" data-react-shell data-react-template="admin-turmas-template"></div>
    <template id="admin-turmas-template">
    <aside class="w-72 glass-sidebar h-screen sticky top-0 flex flex-col p-6">
        <div class="mb-10 text-center">
            <h2 class="text-xl font-bold tracking-tighter text-cyan-400">SECRETARIA DF</h2>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Gestão Acadêmica</p>
        </div>

        <nav class="flex-1 space-y-2">
            <div class="text-[10px] font-bold text-gray-500 mb-2 ml-4">PRINCIPAL</div>
            <a href="{{ url_for('home.admin_dashboard') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Painel Geral
            </a>

            <div class="text-[10px] font-bold text-gray-500 mt-6 mb-2 ml-4">ADMINISTRAÇÃO</div>
            <a href="{{ url_for('home.admin_cadastro_alunos') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Alunos
            </a>
            <a href="{{ url_for('home.admin_cadastro_professores') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Professores
            </a>
            <a href="{{ url_for('home.admin_banco_dados') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Banco de Dados
            </a>

            <div class="text-[10px] font-bold text-gray-500 mt-6 mb-2 ml-4">PEDAGÓGICO</div>
            <a href="{{ url_for('home.admin_disciplinas') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Disciplinas
            </a>
            <a href="{{ url_for('home.admin_turmas') }}" class="flex items-center px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                Turmas
            </a>
            <a href="{{ url_for('home.admin_comunicados') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Comunicados
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/10">
            <a href="{{ url_for('auth.logout') }}" class="flex items-center px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 transition-all">
                Sair do Sistema
            </a>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold">Turmas</h1>
                <p class="text-gray-400">Cadastre turmas e associe alunos e professores.</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-sm font-bold">Admin Secretaria</p>
                    <p class="text-[10px] text-cyan-400">Online agora</p>
                </div>
                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 border-2 border-white/20"></div>
            </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-[380px_minmax(0,1fr)] gap-8">
            <form action="{{ url_for('home.admin_turmas') }}" method="post" class="glass-card turma-card rounded-[32px] p-8">
                <input type="hidden" name="action" value="create">
                <h2 class="text-xl font-bold">Nova Turma</h2>
                <p class="mt-1 text-sm text-gray-400">Informe os dados principais da turma.</p>

                {% if error %}
                <div class="turma-alert">{{ error }}</div>
                {% endif %}

                <label class="turma-field">
                    <span>Nome</span>
                    <input name="nome" type="text" placeholder="Ex: 1º Ano A" required>
                </label>

                <label class="turma-field">
                    <span>Código</span>
                    <input name="codigo" type="text" placeholder="Ex: 1A-2026" required>
                </label>

                <label class="turma-field">
                    <span>Ano letivo</span>
                    <input name="ano_letivo" type="number" min="2000" step="1" placeholder="Ex: 2026" required>
                </label>

                <label class="turma-field">
                    <span>Turno</span>
                    <select name="turno">
                        <option value="">Selecione o turno</option>
                        <option value="Matutino">Matutino</option>
                        <option value="Vespertino">Vespertino</option>
                        <option value="Noturno">Noturno</option>
                        <option value="Integral">Integral</option>
                    </select>
                </label>

                <button class="turma-submit">Cadastrar Turma</button>
            </form>

            <section class="glass-card turma-card rounded-[32px] p-8">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-xl font-bold">Turmas Cadastradas</h2>
                        <p class="text-sm text-gray-400">{{ turmas|length }} registros encontrados</p>
                    </div>
                </div>

                <div class="turma-table-wrapper">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-500 text-xs uppercase tracking-wider">
                                <th class="pb-4 font-medium">Nome</th>
                                <th class="pb-4 font-medium">Código</th>
                                <th class="pb-4 font-medium">Ano</th>
                                <th class="pb-4 font-medium text-right">Turno</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm">
                            {% for turma in turmas %}
                            <tr class="border-t border-white/5">
                                <td class="py-4 font-medium text-white">{{ turma.nome }}</td>
                                <td class="py-4 text-cyan-400">{{ turma.codigo }}</td>
                                <td class="py-4 text-gray-400">{{ turma.ano_letivo }}</td>
                                <td class="py-4 text-right text-gray-400">{{ turma.turno }}</td>
                            </tr>
                            {% else %}
                            <tr class="border-t border-white/5">
                                <td class="py-6 text-gray-400" colspan="4">Nenhuma turma cadastrada.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <section class="grid grid-cols-1 xl:grid-cols-2 gap-8 mt-8">
            <form action="{{ url_for('home.admin_turmas') }}" method="post" class="glass-card turma-card rounded-[32px] p-8">
                <input type="hidden" name="action" value="associate_student">
                <h2 class="text-xl font-bold">Associar Aluno</h2>
                <p class="mt-1 text-sm text-gray-400">Vincule um aluno a uma turma cadastrada.</p>

                <label class="turma-field">
                    <span>Aluno</span>
                    <select name="aluno_id" required>
                        <option value="">Selecione um aluno</option>
                        {% for aluno in alunos %}
                        <option value="{{ aluno.id }}">{{ aluno.nome }} - {{ aluno.matricula }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label class="turma-field">
                    <span>Turma</span>
                    <select name="turma_id" required>
                        <option value="">Selecione uma turma</option>
                        {% for turma in turmas %}
                        <option value="{{ turma.id }}">{{ turma.nome }} - {{ turma.codigo }}</option>
                        {% endfor %}
                    </select>
                </label>

                <button class="turma-submit">Associar Aluno</button>
            </form>

            <form action="{{ url_for('home.admin_turmas') }}" method="post" class="glass-card turma-card rounded-[32px] p-8">
                <input type="hidden" name="action" value="associate_teacher">
                <h2 class="text-xl font-bold">Associar Professor</h2>
                <p class="mt-1 text-sm text-gray-400">As disciplinas do professor serão vinculadas à turma automaticamente.</p>

                <label class="turma-field">
                    <span>Professor</span>
                    <select name="professor_id" required>
                        <option value="">Selecione um professor</option>
                        {% for professor in professores %}
                        <option value="{{ professor.id }}">{{ professor.nome }} - {{ professor.disciplinas }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label class="turma-field">
                    <span>Turma</span>
                    <select name="turma_id" required>
                        <option value="">Selecione uma turma</option>
                        {% for turma in turmas %}
                        <option value="{{ turma.id }}">{{ turma.nome }} - {{ turma.codigo }}</option>
                        {% endfor %}
                    </select>
                </label>

                <button class="turma-submit">Associar Professor</button>
            </form>
        </section>

        <section class="grid grid-cols-1 xl:grid-cols-2 gap-8 mt-8">
            <div class="glass-card turma-card rounded-[32px] p-8">
                <h2 class="text-xl font-bold">Alunos por Turma</h2>
                <div class="turma-link-list">
                    {% for vinculo in aluno_vinculos %}
                    <article class="turma-link-item">
                        <div>
                            <h3>{{ vinculo.aluno }}</h3>
                            <p>{{ vinculo.matricula }}</p>
                        </div>
                        <div class="text-right">
                            <strong>{{ vinculo.turma }}</strong>
                            <span>{{ vinculo.codigo }}</span>
                        </div>
                    </article>
                    {% else %}
                    <div class="turma-empty">Nenhum aluno associado ainda.</div>
                    {% endfor %}
                </div>
            </div>

            <div class="glass-card turma-card rounded-[32px] p-8">
                <h2 class="text-xl font-bold">Professores por Turma</h2>
                <div class="turma-link-list">
                    {% for vinculo in professor_vinculos %}
                    <article class="turma-link-item">
                        <div>
                            <h3>{{ vinculo.professor }}</h3>
                            <p>{{ vinculo.disciplina }}</p>
                        </div>
                        <div class="text-right">
                            <strong>{{ vinculo.turma }}</strong>
                            <span>{{ vinculo.codigo }}</span>
                        </div>
                    </article>
                    {% else %}
                    <div class="turma-empty">Nenhum professor associado ainda.</div>
                    {% endfor %}
                </div>
            </div>
        </section>

        <section class="mt-8">
            <div class="glass-card turma-card rounded-[32px] p-8">
                <h2 class="text-xl font-bold">Disciplinas puxadas dos Professores</h2>
                <div class="turma-link-list">
                    {% for vinculo in disciplina_vinculos %}
                    <article class="turma-link-item">
                        <div>
                            <h3>{{ vinculo.disciplina }}</h3>
                            <p>{{ vinculo.disciplina_codigo }}</p>
                        </div>
                        <div class="text-right">
                            <strong>{{ vinculo.turma }}</strong>
                            <span>{{ vinculo.codigo }}</span>
                        </div>
                    </article>
                    {% else %}
                    <div class="turma-empty">Nenhuma disciplina associada ainda.</div>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    </template>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
