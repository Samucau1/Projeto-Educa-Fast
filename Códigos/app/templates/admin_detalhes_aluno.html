{% set page_title = 'Detalhes do aluno' %}
{% from 'partials/gestao_icons.html' import icon %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Aluno | Educa Fast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detalhes.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="app-page">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="admin-detalhes-aluno-root" class="flex w-full" data-react-shell data-react-template="admin-detalhes-aluno-template"></div>
    <template id="admin-detalhes-aluno-template">

    {% include 'partials/workspace_sidebar.html' %}

    <div class="workspace-main">
    {% include 'partials/workspace_topbar.html' %}
    <main id="main-content" class="app-content">
        <header class="flex justify-between items-center mb-10">
            <div>
                <span class="eyebrow">GESTÃO ESCOLAR</span>
                    <h1 class="text-3xl font-bold">Detalhes do Aluno</h1>
                <p class="text-gray-400">Acompanhe documentos, histórico e evolução acadêmica.</p>
            </div>

        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <section class="glass-card detalhes-card p-8 rounded-[32px] text-center">
                {% if aluno.foto_perfil %}
                <img src="{{ url_for('document.perfil_arquivo', filename=aluno.foto_perfil) }}" alt="Foto de {{ aluno.nome }}" class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-white/10 object-cover">
                {% else %}
                <div class="w-32 h-32 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full mx-auto mb-4 border-4 border-white/10"></div>
                {% endif %}
                <h2 class="text-2xl font-bold">{{ aluno.nome }}</h2>
                <p class="text-cyan-400">Matrícula: {{ aluno.matricula }}</p>
                <p class="text-gray-400 text-sm mt-2">Nasc: {{ aluno.data_nascimento }}</p>
                <p class="text-gray-400 text-sm mt-1">{{ aluno.curso }}</p>
                <p class="text-gray-500 text-xs mt-1">{{ aluno.email }}</p>

                <form action="{{ url_for('home.admin_editar_aluno', aluno_id=aluno.id) }}" method="post" enctype="multipart/form-data" class="aluno-edit-form">
                    <h3>Editar Dados</h3>
                    <label>
                        <span>Foto de Perfil</span>
                        <input name="foto_perfil" type="file" accept="image/png,image/jpeg">
                    </label>
                    <label>
                        <span>Nome</span>
                        <input name="nome" type="text" value="{{ aluno.nome }}" required>
                    </label>
                    <label>
                        <span>E-mail</span>
                        <input name="email" type="email" value="{{ aluno.email }}" required>
                    </label>
                    <div class="aluno-edit-grid">
                        <label>
                            <span>CPF</span>
                            <input name="cpf" type="text" value="{{ aluno.cpf_value }}">
                        </label>
                        <label>
                            <span>Matrícula</span>
                            <input name="matricula" type="text" value="{{ aluno.matricula }}" required>
                        </label>
                    </div>
                    <label>
                        <span>Curso/Série</span>
                        <input name="curso_serie" type="text" value="{{ aluno.curso_value }}">
                    </label>
                    <div class="aluno-edit-grid">
                        <label>
                            <span>Status</span>
                            <select name="status_matricula">
                                <option value="">Não informado</option>
                                <option value="Ativo" {% if aluno.status_value == "Ativo" %}selected{% endif %}>Ativo</option>
                                <option value="Pendente" {% if aluno.status_value == "Pendente" %}selected{% endif %}>Pendente</option>
                                <option value="Inativo" {% if aluno.status_value == "Inativo" %}selected{% endif %}>Inativo</option>
                            </select>
                        </label>
                        <label>
                            <span>Nascimento</span>
                            <input name="data_nascimento" type="date" value="{{ aluno.data_nascimento_value }}">
                        </label>
                    </div>
                    <button>Salvar Alterações</button>
                </form>
            </section>

            <section class="lg:col-span-2 glass-card detalhes-card p-8 rounded-[32px]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Documentos do Aluno</h3>
                    <span class="text-sm text-cyan-400">Solicitações e arquivos</span>
                </div>

                <div class="flex gap-4 border-b border-white/10 mb-6" data-documento-tabs>
                    <button type="button" class="documento-tab pb-2 border-b-2 border-cyan-400 text-white" data-documento-tab="solicitacoes">Solicitações</button>
                    <button type="button" class="documento-tab pb-2 text-gray-500" data-documento-tab="enviados">Enviados</button>
                </div>

                <div data-documento-panel="solicitacoes">
                    <form action="{{ url_for('home.admin_solicitar_documento_aluno', aluno_id=aluno.id) }}" method="post" class="documento-request-form">
                        <label>
                            <span>Documento solicitado</span>
                            <input name="titulo" type="text" placeholder="Ex: Comprovante de residência" required>
                        </label>
                        <label>
                            <span>Orientação para o aluno</span>
                            <textarea name="mensagem" placeholder="Informe prazo, formato ou observações importantes."></textarea>
                        </label>
                        <button>Disparar solicitação</button>
                    </form>

                    <form action="{{ url_for('document.upload_arquivo') }}" method="post" enctype="multipart/form-data" class="documento-request-form mt-8">
                        <input type="hidden" name="aluno_id" value="{{ aluno.id }}">
                        <input type="hidden" name="redirect_to" value="{{ url_for('home.admin_detalhes_aluno', aluno_id=aluno.id) }}">
                        <label>
                            <span>Documentos do aluno</span>
                            <input name="titulo" type="text" placeholder="Ex: Histórico escolar" required>
                        </label>
                        <label>
                            <span>Arquivo</span>
                            <input name="arquivo" type="file" required>
                        </label>
                        <button>Enviar Arquivo</button>
                    </form>

                    <div class="mt-8">
                        <h4 class="mb-4 text-sm font-bold uppercase tracking-wider text-gray-400">Solicitações enviadas</h4>
                        {% for solicitacao in solicitacoes_documentos %}
                        <div class="documento-request-item">
                            <div>
                                <span class="block text-white">{{ solicitacao.titulo }}</span>
                                <span class="text-xs text-gray-500">{{ solicitacao.mensagem }}</span>
                            </div>
                            <div class="text-right">
                                <span class="documento-status documento-status-{{ solicitacao.status }}">{{ solicitacao.status_label }}</span>
                                <span class="block text-xs text-gray-500 mt-2">{{ solicitacao.data }}</span>
                            </div>
                        </div>
                        {% else %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5 text-gray-400">
                            Nenhuma solicitação enviada para este aluno.
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="hidden" data-documento-panel="enviados">
                    <h4 class="mb-4 text-sm font-bold uppercase tracking-wider text-gray-400">Documentos do aluno</h4>
                    {% for documento in documentos %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 flex justify-between border border-white/5">
                            <div>
                                <span class="block text-white">{{ documento.titulo }}</span>
                                <span class="text-xs text-gray-500">{{ documento.data_envio }}</span>
                            </div>
                            <a href="{{ url_for('document.download_arquivo', filename=documento.arquivo) }}" class="text-cyan-400">Baixar</a>
                        </div>
                    {% else %}
                        <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5 text-gray-400">
                            Nenhum documento enviado para este aluno.
                        </div>
                    {% endfor %}
                </div>
            </section>
        </div>
    </main>
    </div>
</template>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
