<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ disciplina.nome }} | Área do Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/aluno_painel.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="flex">
    <div id="aluno-disciplina-root" class="flex w-full" data-react-shell data-react-template="aluno-disciplina-template"></div>
    <template id="aluno-disciplina-template">
    <aside class="w-72 glass-sidebar h-screen sticky top-0 flex flex-col p-6">
        <div class="mb-10 text-center">
            <h2 class="text-xl font-bold tracking-tighter text-cyan-400">SECRETARIA DF</h2>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Portal do Aluno</p>
        </div>

        <nav class="flex-1 space-y-2">
            <div class="text-[10px] font-bold text-gray-500 mb-2 ml-4">MINHA ÁREA</div>
            <a href="{{ url_for('aluno.dashboard') }}" class="flex items-center px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-gray-300 hover:text-white">
                Voltar
            </a>
            <a href="{{ url_for('aluno.dashboard') }}" class="flex items-center px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                Disciplinas
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/10">
            <a href="{{ url_for('auth.logout') }}" class="flex items-center px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 transition-all">
                Sair do Sistema
            </a>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <p class="text-sm text-cyan-400 font-bold">Disciplina</p>
                <h1 class="text-3xl font-bold">{{ disciplina.nome }}</h1>
                <p class="text-gray-400">Código {{ disciplina.codigo }} · {{ disciplina.carga_horaria }}h</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-sm font-bold">{{ aluno.nome }}</p>
                    <p class="text-[10px] text-cyan-400">Matrícula {{ aluno.matricula }}</p>
                </div>
                {% if aluno.foto_perfil %}
                <img src="{{ url_for('document.perfil_arquivo', filename=aluno.foto_perfil) }}" alt="Foto de {{ aluno.nome }}" class="w-12 h-12 rounded-full border-2 border-white/20 object-cover">
                {% else %}
                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 border-2 border-white/20"></div>
                {% endif %}
            </div>
        </header>

        <section class="glass-card aluno-card rounded-[32px] p-8 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Professores</h2>
                <span class="text-sm text-gray-400">Vinculados à sua turma</span>
            </div>
            <div class="flex flex-wrap gap-2">
                {% for professor in disciplina.professores %}
                <span class="aluno-chip">{{ professor }}</span>
                {% else %}
                <span class="text-sm text-gray-400">Nenhum professor associado.</span>
                {% endfor %}
            </div>
        </section>

        <section class="glass-card aluno-card rounded-[32px] p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Atividades e Arquivos</h2>
                <span class="text-sm text-gray-400">Materiais enviados pelo professor</span>
            </div>

            <div class="aluno-exclusive-activities">
                {% for atividade in atividades %}
                <article class="aluno-exclusive-activity">
                    <div>
                        <strong>{{ atividade.titulo }}</strong>
                        <span>{{ atividade.professor }} · Entrega: {{ atividade.data_entrega }}</span>
                        <p>{{ atividade.descricao }}</p>
                        <small>{{ atividade.data }}</small>
                    </div>
                    {% if atividade.arquivo %}
                    <a href="{{ url_for('document.download_arquivo', filename=atividade.arquivo) }}">Baixar arquivo</a>
                    {% endif %}
                </article>
                {% else %}
                <div class="aluno-activity-empty">Nenhuma atividade lançada nesta disciplina.</div>
                {% endfor %}
            </div>
        </section>
    </main>

    </template>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
