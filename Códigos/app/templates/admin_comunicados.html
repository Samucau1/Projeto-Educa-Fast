{% set page_title = 'Comunicados' %}
{% from 'partials/gestao_icons.html' import icon %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicados | Educa Fast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_comunicados.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="app-page">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="admin-comunicados-root" class="flex w-full" data-react-shell data-react-template="admin-comunicados-template"></div>
    <template id="admin-comunicados-template">

    {% include 'partials/workspace_sidebar.html' %}

    <div class="workspace-main">
    {% include 'partials/workspace_topbar.html' %}
    <main id="main-content" class="app-content">
        <header class="flex justify-between items-center mb-10">
            <div>
                <span class="eyebrow">GESTÃO ESCOLAR</span>
                    <h1 class="text-3xl font-bold">Comunicados</h1>
                <p class="text-gray-400">Envie recados institucionais para todos os usuários do sistema.</p>
            </div>

        </header>

        <div class="comunicados-layout">
            <section class="glass-card comunicado-card rounded-[20px] p-10">
                <div class="mb-10 flex items-center gap-4">
                    <h2 class="text-2xl font-bold">Comunicado Geral</h2>
                </div>

                {% if error %}
                <p class="mb-6 rounded-xl border border-red-400/30 bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-200">{{ error }}</p>
                {% endif %}

                <form method="post" class="space-y-9">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <label class="block">
                        <span class="mb-2 block text-sm font-bold text-slate-300">Título do Recado</span>
                        <input name="titulo" type="text" maxlength="150" placeholder="Ex: Reunião de Pais e Mestres" class="comunicado-field" required>
                    </label>

                    <label class="block">
                        <span class="mb-2 block text-sm font-bold text-slate-300">Mensagem</span>
                        <textarea name="mensagem" rows="6" maxlength="10000" placeholder="Digite a mensagem oficial para envio imediato..." class="comunicado-field comunicado-textarea" required></textarea>
                    </label>

                    <div class="flex justify-end">
                        <button type="submit" class="comunicado-submit">
                            Disparar Comunicado

                        </button>
                    </div>
                </form>
            </section>

            <aside class="glass-card comunicados-enviados rounded-[20px] p-8">
                <h2 class="text-lg font-bold">Recados Enviados</h2>

                <div class="mt-7 space-y-4">
                    {% for comunicado in comunicados %}
                    <article class="recado-card">
                        <div class="flex items-start justify-between gap-4">
                            <h3>{{ comunicado.titulo }}</h3>
                            <span>{{ comunicado.created_at_label }}</span>
                        </div>
                        <p>{{ comunicado.mensagem_resumo }}</p>
                    </article>
                    {% else %}
                    <div class="recado-card">
                        <h3>Nenhum comunicado enviado</h3>
                        <p>Os recados criados aparecerão nesta lista.</p>
                    </div>
                    {% endfor %}
                </div>

                <a href="{{ url_for('gestao.mensagens') }}" class="ver-todos-button">Ver mensagens completas</a>
            </aside>
        </div>
    </main>
    </div>


    </template>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
