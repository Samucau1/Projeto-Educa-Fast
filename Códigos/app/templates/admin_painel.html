{% set page_title = 'Visão geral' %}
{% from 'partials/gestao_icons.html' import icon %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Educa Fast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="app-page">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="admin-painel-root" class="flex w-full" data-react-shell data-react-template="admin-painel-template"></div>
    <template id="admin-painel-template">
        {% include 'partials/workspace_sidebar.html' %}

        <div class="workspace-main">
    {% include 'partials/workspace_topbar.html' %}
    <main id="main-content" class="app-content">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <span class="eyebrow">GESTÃO ESCOLAR</span>
                    <h1 class="text-3xl font-bold">Olá, {{ session.get("user_email", "Administrador") }}!</h1>
                    <p class="text-slate-300">Bem-vindo ao centro de controle da sua escola.</p>
                </div>

            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="glass-card p-6 rounded-3xl">
                    <p class="text-slate-300 text-sm">Total de Alunos</p>
                    <h2 class="text-4xl font-bold mt-2">{{ total_alunos }}</h2>
                    <div class="mt-4 text-xs text-emerald-300">Registros cadastrados</div>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <p class="text-slate-300 text-sm">Professores Cadastrados</p>
                    <h2 class="text-4xl font-bold mt-2">{{ total_professores }}</h2>
                    <div class="mt-4 text-xs text-cyan-300">Todos os departamentos</div>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <p class="text-slate-300 text-sm">Matrículas Pendentes</p>
                    <h2 class="text-4xl font-bold mt-2">{{ matriculas_pendentes }}</h2>
                    <div class="mt-4 text-xs text-violet-300">{{ matriculas_hoje }} criadas hoje</div>
                </div>
            </div>

            <div class="glass-card p-8 rounded-[32px]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Últimos Registros</h3>
                    <a href="{{ url_for('home.admin_banco_dados') }}" class="text-sm text-cyan-300 hover:underline">Ver todos</a>
                </div>
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-400 text-xs uppercase tracking-wider">
                            <th class="pb-4 font-medium">Nome</th>
                            <th class="pb-4 font-medium">Tipo</th>
                            <th class="pb-4 font-medium">Data</th>
                            <th class="pb-4 font-medium text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm">
                        {% for registro in registros_recentes %}
                        <tr class="border-t border-white/5">
                            <td class="py-4 font-medium text-white">{{ registro.nome }}</td>
                            <td class="py-4 text-slate-300">{{ registro.tipo }}</td>
                            <td class="py-4 text-slate-300">{{ registro.created_at_label }}</td>
                            <td class="py-4 text-right">
                                {% if registro.aluno_id %}
                                <a href="{{ url_for('home.admin_detalhes_aluno', aluno_id=registro.aluno_id) }}" class="bg-white/10 px-3 py-1 rounded-lg hover:bg-white/20">Gerenciar</a>
                                {% else %}
                                <button class="bg-white/10 px-3 py-1 rounded-lg opacity-60">Gerenciar</button>
                                {% endif %}
                            </td>
                        </tr>
                        {% else %}
                        <tr class="border-t border-white/5">
                            <td class="py-6 text-slate-300" colspan="4">Nenhum registro encontrado.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    </template>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
