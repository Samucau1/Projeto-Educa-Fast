{% set page_title = 'Cadastro de professores' %}
{% from 'partials/gestao_icons.html' import icon %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professores | Educa Fast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
    {% include "partials/react_runtime.html" %}
</head>
<body class="app-page">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="admin-cadastro-professores-root" class="flex w-full" data-react-shell data-react-template="admin-cadastro-professores-template"></div>
    <template id="admin-cadastro-professores-template">
    {% include 'partials/workspace_sidebar.html' %}

    <div class="workspace-main">
    {% include 'partials/workspace_topbar.html' %}
    <main id="main-content" class="app-content">
        <header class="mb-10 flex flex-col gap-5 md:flex-row md:items-center md:justify-between">
            <div>
                <span class="eyebrow">GESTÃO ESCOLAR</span>
                    <h1 class="text-3xl font-bold">Cadastro de Professores</h1>
                <p class="text-gray-400">Insira as informações do novo docente no sistema.</p>
            </div>

            <div class="flex flex-wrap gap-4">
                <button type="reset" form="professor-form" class="inline-flex h-12 items-center rounded-xl border border-white/10 bg-white/5 px-6 font-bold text-white transition hover:bg-white/10">
                    Limpar
                </button>
                <button type="submit" form="professor-form" class="inline-flex h-12 items-center rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 px-7 font-bold text-white transition hover:brightness-110">
                    Salvar Registro
                </button>
            </div>
        </header>

            <div class="grid gap-8 xl:grid-cols-[minmax(0,1fr)_368px]">
                <form id="professor-form" class="glass-card cadastro-card rounded-[32px] px-6 py-8 md:px-10 lg:px-10" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <section>
                        <h2 class="text-xl font-extrabold text-white">Informações Gerais</h2>
                        <div class="mt-5 border-t border-white/10 pt-7">
                            <div class="grid gap-8 md:grid-cols-2">
                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Nome Completo</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="text" name="nome" placeholder="Ex: Prof. Mariana Souza" required>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Disciplina Principal</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="text" name="disciplina" placeholder="Ex: Matemática" required>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Formação Acadêmica</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="text" name="formacao" placeholder="Ex: Licenciatura em Matemática">
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Telefone / WhatsApp</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="tel" name="telefone" placeholder="(61) 99999-9999">
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">CPF</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="text" name="cpf" placeholder="000.000.000-00" required>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">E-mail de Acesso</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-4">
                                        <input type="email" name="email" placeholder="professor@email.com" required>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </section>

                    <section class="mt-9">
                        <h2 class="text-xl font-extrabold text-white">Cargo e Horários</h2>
                        <div class="mt-5 border-t border-white/10 pt-7">
                            <div class="grid gap-8 md:grid-cols-2">
                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Regime de Trabalho</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-5">
                                        <select name="regime">
                                            <option>20 horas semanais</option>
                                            <option>30 horas semanais</option>
                                            <option>40 horas semanais</option>
                                            <option>Dedicação exclusiva</option>
                                        </select>
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Data de Admissão</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-5">
                                        <input type="date" name="data_admissao">
                                    </span>
                                </label>

                                <label class="block">
                                    <span class="mb-2 block text-sm font-medium text-slate-300">Senha Inicial</span>
                                    <span class="field flex h-14 items-center rounded-2xl px-5">
                                        <input type="password" name="senha" placeholder="Defina uma senha" required>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </section>
                    <p id="professor-feedback" class="mt-8 hidden rounded-2xl border px-4 py-3 text-sm font-semibold"></p>
                </form>

                <aside class="space-y-8">
                    <section class="glass-card cadastro-card rounded-[32px] px-8 py-9">
                        <h2 class="text-lg font-extrabold text-white">Foto do Professor</h2>
                        <label class="mx-auto mt-7 flex aspect-square w-40 cursor-pointer flex-col items-center justify-center rounded-[22px] border-2 border-dashed border-cyan-400/35 bg-white/5 text-center transition hover:border-cyan-300 hover:bg-white/10">
                            <input type="file" name="foto_perfil" form="professor-form" class="sr-only" accept="image/png,image/jpeg">
                            <span class="photo-upload-symbol">{{ icon('users') }}</span>
                            <span class="mt-3 text-xs text-slate-400">Carregar Imagem</span>
                        </label>
                        <p class="mt-7 text-center text-[11px] leading-5 text-slate-400">Imagem para o crachá funcional.<br>Tamanho máximo: 2MB.</p>
                    </section>

                    <section class="rounded-[20px] border border-cyan-500/20 bg-cyan-500/10 px-8 py-8 shadow-2xl shadow-black/20">
                        <h2 class="text-lg font-extrabold text-white">Nota Informativa</h2>
                        <p class="mt-5 text-sm leading-6 text-slate-300">Os dados de formação acadêmica são validados automaticamente com o banco de dados do MEC. Certifique-se da grafia correta do nome.</p>
                    </section>
                </aside>
            </div>
    </main>
    </div>
</template>
    <script>
        window.__REACT_PAGE__ = {
            routes: {
                cadastroProfessor: {{ url_for('auth.cadastro_professor')|tojson }}
            }
        };
    </script>
    <script src="{{ url_for('static', filename='js/paginas/cadastro.js') }}"></script>
    <script src="{{ url_for('static', filename='js/compartilhado/shell_react.js') }}"></script>
</body>
</html>
